<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>body{font-family:Segoe UI,Arial;margin:24px;background:#f7f7f7;color:#222}h1{color:#20304a}.box{background:white;padding:16px;border-left:5px solid #4b75bd}img{max-width:100%;border-radius:6px}</style></head><body><h1>Elden Ring</h1><div class="box"><p><b>Коротка історія:</b> Гравець подорожує Міжзем'ям і збирає силу, щоб стати новим володарем. Світ великий, небезпечний і майже нічого не пояснює прямо.</p><p>Цікаво, що історію треба складати самому з описів предметів, діалогів і місць на карті.</p></div></body></html>
