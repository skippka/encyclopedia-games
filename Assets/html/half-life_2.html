<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>body{font-family:Segoe UI,Arial;margin:24px;background:#f7f7f7;color:#222}h1{color:#20304a}.box{background:white;padding:16px;border-left:5px solid #4b75bd}img{max-width:100%;border-radius:6px}</style></head><body><h1>Half-Life 2</h1><div class="box"><p><b>Коротка історія:</b> Гордон Фрімен потрапляє у місто, яке контролює Альянс. Разом з повстанцями він бореться проти окупації.</p><p>Гра відома фізикою, атмосферою і тим, що багато подій відбуваються прямо під час гри, а не тільки в роликах.</p></div></body></html>
