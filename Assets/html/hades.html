<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>body{font-family:Segoe UI,Arial;margin:24px;background:#f7f7f7;color:#222}h1{color:#20304a}.box{background:white;padding:16px;border-left:5px solid #4b75bd}img{max-width:100%;border-radius:6px}</style></head><body><h1>Hades</h1><div class="box"><p><b>Коротка історія:</b> Загрей, син Аїда, намагається втекти з підземного світу. Кожна спроба відкриває нові діалоги і частини сюжету.</p><p>Навіть коли програєш, гра не відчувається марною, бо історія все одно рухається вперед.</p></div></body></html>
