<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>body{font-family:Segoe UI,Arial;margin:24px;background:#f7f7f7;color:#222}h1{color:#20304a}.box{background:white;padding:16px;border-left:5px solid #4b75bd}img{max-width:100%;border-radius:6px}</style></head><body><h1>Stardew Valley</h1><div class="box"><p><b>Коротка історія:</b> Герой отримує стару ферму від дідуся і переїжджає в маленьке містечко. Там можна вирощувати рослини, ловити рибу, дружити з жителями і досліджувати печери.</p><p>Це спокійна гра, але в ній багато справ, тому легко загратися надовго.</p></div></body></html>
