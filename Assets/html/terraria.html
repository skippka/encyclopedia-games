<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>body{font-family:Segoe UI,Arial;margin:24px;background:#f7f7f7;color:#222}h1{color:#20304a}.box{background:white;padding:16px;border-left:5px solid #4b75bd}img{max-width:100%;border-radius:6px}</style></head><body><h1>Terraria</h1><div class="box"><p><b>Коротка історія:</b> Terraria починається просто: є персонаж, інструменти і випадковий світ. Далі гравець будує базу, знаходить підземелля і б'ється з босами.</p><p>Гра виглядає просто, але в ній дуже багато предметів, біомів і секретів.</p></div></body></html>
