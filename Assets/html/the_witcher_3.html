<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>body{font-family:Segoe UI,Arial;margin:24px;background:#f7f7f7;color:#222}h1{color:#20304a}.box{background:white;padding:16px;border-left:5px solid #4b75bd}img{max-width:100%;border-radius:6px}</style></head><body><h1>The Witcher 3</h1><div class="box"><p><b>Коротка історія:</b> Геральт шукає Цірі, яка тікає від Дикого Гону. У грі багато виборів, і через них світ може змінюватися по-різному.</p><p>Мені подобається, що тут не просто бійки, а ще є квести з історіями, де не завжди зрозуміло, хто правий.</p></div></body></html>
